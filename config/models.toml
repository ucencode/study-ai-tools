# Which models can play which role.
#
# Ollama ships new models constantly and this list goes stale fast — add new entries
# as you pull them. Nothing here is a whitelist: any model Ollama already has works
# even if it is not listed, it just shows up as "unlisted" with no role hints.
#
#   roles  vision = OCR of page images | refine = clean up / rewrite OCR text
#          llm    = curriculum plans and study material
#   where  local  = runs on this machine | cloud = Ollama Cloud, needs a signed-in ollama

[[models]]
name = "qwen3-vl:8b"
roles = ["vision"]
where = "local"

[[models]]
name = "qwen2.5vl:7b"
roles = ["vision"]
where = "local"

